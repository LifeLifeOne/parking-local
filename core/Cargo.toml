[package]
name = "parking-core"
version = "0.1.0"
edition = "2021"
[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
[dev-dependencies]
tempfile = "3"
